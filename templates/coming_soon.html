{% extends "base.html" %}

{% block title %}Feature Coming Soon - Clinic-Buddy{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <!-- Icon -->
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-32 h-32 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-full shadow-2xl">
                <span class="text-6xl">🚀</span>
            </div>
        </div>

        <!-- Main Message -->
        <h1 class="text-5xl font-bold text-gray-900 mb-6">
            Feature is on the way
        </h1>
        
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-8 border-2 border-purple-200">
            <p class="text-2xl text-gray-700 leading-relaxed">
                Developer needs more time to prepare MVP
            </p>
        </div>

        <!-- Additional Info -->
        <div class="mb-8">
            <div class="inline-flex items-center space-x-2 bg-indigo-100 text-indigo-800 px-6 py-3 rounded-full">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-semibold">Coming Soon</span>
            </div>
        </div>

        <!-- Back Button -->
        <div class="space-y-4">
            <a href="javascript:history.back()" 
               class="inline-block bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-8 py-4 rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 transition-all transform hover:scale-105 shadow-lg">
                ← Go Back
            </a>
            
            <div>
                <a href="/" 
                   class="inline-block text-indigo-600 hover:text-indigo-800 font-semibold transition">
                    or Return to Home
                </a>
            </div>
        </div>

        <!-- Footer Note -->
        <div class="mt-12 text-gray-500 text-sm">
            <p>Thank you for your patience! 🙏</p>
        </div>
    </div>
</div>
{% endblock %}
